server.port=${PORT:3001}
server.forward-headers-strategy=framework
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_SIZE:1}
spring.datasource.hikari.connection-timeout=${DB_POOL_TIMEOUT_SECONDS:8000}
spring.datasource.hikari.idle-timeout=${DB_POOL_MAX_IDLE_SECONDS:300000}
spring.main.banner-mode=off
logging.level.root=INFO
