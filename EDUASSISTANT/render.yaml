services:
  - type: web
    name: MLAI
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python backend/server.py
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_SECRET
        generateValue: true
      - key: SIGNATURE_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: AGENT_ENABLED
        value: true
      - key: AGENT_MAX_TOOL_STEPS
        value: 4
      - key: AGENT_RAG_TOP_K
        value: 5
      - key: AGENT_HISTORY_MESSAGES
        value: 12
      - key: AGENT_ACTION_TTL_SECONDS
        value: 300
      - key: AGENT_MAX_MESSAGE_CHARS
        value: 6000
      - key: GEMINI_EMBEDDING_MODEL
        value: ''
      - key: ALLOW_ADMIN_VERIFIED_DEMO_SIS
        value: false
      - key: AI_MODE
        value: live
      - key: FRONTEND_URL
        sync: false
