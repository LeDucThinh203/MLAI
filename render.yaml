services:
  - type: web
    name: MLAI
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./EDUASSISTANT/Dockerfile
    dockerContext: ./EDUASSISTANT
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: 3001
      - key: PROJECT_ROOT
        value: /app
      - key: DATA_DIR
        value: /app/storage
      - key: SEED_DEMO_DATA
        value: false
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DB_POOL_MIN_SIZE
        value: 1
      - key: DB_POOL_MAX_SIZE
        value: 10
      - key: DB_POOL_TIMEOUT_SECONDS
        value: 8
      - key: DB_POOL_MAX_IDLE_SECONDS
        value: 300
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_SECRET
        generateValue: true
      - key: SIGNATURE_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: AGENT_ENABLED
        value: true
      - key: AGENT_MAX_TOOL_STEPS
        value: 4
      - key: AGENT_RAG_TOP_K
        value: 5
      - key: AGENT_HISTORY_MESSAGES
        value: 12
      - key: AGENT_ACTION_TTL_SECONDS
        value: 300
      - key: AGENT_MAX_MESSAGE_CHARS
        value: 6000
      - key: GEMINI_EMBEDDING_MODEL
        value: ''
      - key: ALLOW_ADMIN_VERIFIED_DEMO_SIS
        value: false
      - key: AI_MODE
        value: live
      - key: FRONTEND_URL
        sync: false
