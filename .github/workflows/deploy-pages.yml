name: LEGACY - GitHub Pages (not current production)

# LEGACY / NOT CURRENT PRODUCTION. The live frontend is hosted on Cloudflare Pages.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: EDUASSISTANT/frontend/package-lock.json

      - name: Build frontend
        working-directory: EDUASSISTANT/frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          npm ci
          npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: EDUASSISTANT/frontend/dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
