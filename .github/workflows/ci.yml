name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: EDUASSISTANT
    env:
      APP_ENV: test
      AI_MODE: mock
      SEED_DEMO_DATA: "false"
      ALLOW_ADMIN_VERIFIED_DEMO_SIS: "false"
      DATABASE_URL: ""
      GEMINI_API_KEY: ""
      OPENROUTER_API_KEY: ""
      GEMINI_EMBEDDING_MODEL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: EDUASSISTANT/requirements.txt
      - run: python -m pip install -r requirements.txt pytest pytest-asyncio
      - run: >-
          python -m pytest -q
          test/test_agent_planner.py
          test/test_agent_hardening.py
          test/test_agent_tools.py
          test/test_agent_tool_privacy.py
          test/test_agent_rag.py
          test/test_agent_security.py
          test/test_student_agent_only.py
          test/test_agent_conversation_delete.py
          test/test_agent_attachment.py
          test/test_production_safety.py
          test/test_rule_engine_hardening.py
          test/test_judge_summary.py
          test/test_escalation_policy_service.py
          test/test_holdout_eval.py
          test/test_ocr_service.py
          test/test_benchmark_provenance.py
      - run: >-
          python -c "import sys; sys.path.insert(0, 'backend'); from app.services.verify_harness_service import run_verify_harness; result = run_verify_harness(); assert result['total'] == 9 and result['failed'] == 0 and not result['networkCallsPerformed'] and not result['databaseWritesPerformed']"
      - run: python benchmark/run_benchmark.py
      - run: >-
          python -c "import hashlib, json, pathlib; root = pathlib.Path('.'); dataset = root / 'benchmark' / 'fixed_synthetic_cases.json'; result = json.loads((root / 'benchmark' / 'results' / 'latest.json').read_text(encoding='utf-8')); assert result['scenarioCount'] == 18 and result['aiCallsPerformed'] is False and result['datasetSha256'] == hashlib.sha256(dataset.read_bytes()).hexdigest() and len(result['caseResults']) == 18"
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: EDUASSISTANT/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: EDUASSISTANT/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  competition-readiness:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: eduassistant_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: eduassistant_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d eduassistant_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: EDUASSISTANT
    env:
      APP_ENV: test
      NODE_ENV: test
      AI_MODE: mock
      SEED_DEMO_DATA: "true"
      ALLOW_ADMIN_VERIFIED_DEMO_SIS: "false"
      # Credentials below are scoped to this disposable PostgreSQL service only.
      DATABASE_URL: postgresql://postgres:eduassistant_test_password@127.0.0.1:5432/eduassistant_test
      GEMINI_API_KEY: ""
      OPENROUTER_API_KEY: ""
      GEMINI_EMBEDDING_MODEL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: EDUASSISTANT/requirements.txt
      - run: python -m pip install -r requirements.txt pytest pytest-asyncio
      - run: python test/test_competition_features.py
