name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: EDUASSISTANT
    env:
      APP_ENV: test
      AI_MODE: mock
      SEED_DEMO_DATA: "false"
      ALLOW_ADMIN_VERIFIED_DEMO_SIS: "false"
      DATABASE_URL: ""
      GEMINI_API_KEY: ""
      OPENROUTER_API_KEY: ""
      GEMINI_EMBEDDING_MODEL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: EDUASSISTANT/requirements.txt
      - run: python -m pip install -r requirements.txt pytest pytest-asyncio
      - run: >-
          python -m pytest -q
          test/test_agent_planner.py
          test/test_agent_hardening.py
          test/test_agent_tools.py
          test/test_agent_tool_privacy.py
          test/test_agent_rag.py
          test/test_agent_security.py
          test/test_production_safety.py
          test/test_rule_engine_hardening.py
          test/test_judge_summary.py
          test/test_ocr_service.py
          test/test_benchmark_provenance.py
      - run: >-
          python -c "import sys; sys.path.insert(0, 'backend'); from app.services.verify_harness_service import run_verify_harness; result = run_verify_harness(); assert result['total'] == 9 and result['failed'] == 0 and not result['networkCallsPerformed'] and not result['databaseWritesPerformed']"
      - run: >-
          python -c "from benchmark.run_benchmark import run_benchmark; result = run_benchmark(); metrics = result['metrics']; assert result['scenarioCount'] == 18 and metrics['correctCases'] == 18 and result['aiCallsPerformed'] is False"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: EDUASSISTANT/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: EDUASSISTANT/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
